# Log de acesso SEM query string: o token de dispositivo GPS pode vir na URL
# (?token=..., exigido pelo Overland/sendBeacon) e não pode parar em texto puro
# no access log. $uri é o caminho já sem os parâmetros — trocamos o $request
# padrão por ele. (log_format precisa ficar no contexto http: este arquivo é
# incluído em conf.d, então aqui fora do server{} funciona.)
log_format sem_query '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sobrepõe o access_log padrão (que logaria a query com o token).
  access_log /var/log/nginx/access.log sem_query;

  # Corpo máximo aceito: margem sobre o limite de 1mb do Express, sem deixar
  # alguém postar gigabytes contra o proxy.
  client_max_body_size 10m;

  # Headers de segurança básicos em todas as respostas.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Compressão dos assets.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets com hash no nome → cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Pegadinha do nginx: add_header NÃO é herdado quando o bloco define o seu
    # próprio add_header — repetimos os de segurança aqui.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  # API e healthcheck → backend (mesma origem, sem CORS).
  # proxy_pass sem path preserva o URI original (/api/... e /health).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Margem para ingestões/relatórios mais demorados.
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass http://api:3000/health;
  }

  # Página web do motorista: o Express serve /motorista e os estáticos
  # motorista.js/.css na raiz — sem isso a rota cairia no SPA fallback.
  location = /motorista {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/motorista\.(js|css)$ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # SPA: todas as demais rotas caem no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
